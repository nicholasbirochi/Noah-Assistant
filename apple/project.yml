# App Noah nativo (iPhone e Mac). Gere o projeto com `xcodegen` nesta pasta.
# Os dois leem a mesma central (src/central/servidor.py) no Mac: é ela que
# mantém os aparelhos sincronizados. Decisão em docs/ADR-0003-app-nativo.md.
name: Noah
options:
  bundleIdPrefix: com.nicholasbirochi
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_CFBundleDisplayName: Noah
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "O Noah conversa com a central no seu Mac, pela rede de casa, para ler e responder as pendências."
packages:
  NoahCore:
    path: Packages/NoahCore
targets:
  Noah-iOS:
    type: application
    platform: iOS
    sources: [App, Compartilhado]
    info:
      path: Config/Noah-iOS-Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.nicholasbirochi.noah.atualizar]
        # Ilha dinâmica e tela bloqueada (Live Activity) e aprovação com Face ID.
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: "O Noah pede o Face ID antes de aceitar, responder ou dispensar uma pendência."
        # Central por voz: o reconhecimento roda só no aparelho.
        NSMicrophoneUsageDescription: "O Noah ouve o microfone na aba Central para você conversar por voz. Dá para deixar mudo."
        NSSpeechRecognitionUsageDescription: "O Noah transforma sua fala em texto no próprio aparelho, sem mandar o áudio para fora."
        CFBundleURLTypes:
          - CFBundleURLName: com.nicholasbirochi.noah
            CFBundleURLSchemes: [noah]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasbirochi.noah.ios
        PRODUCT_NAME: Noah
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Config/Noah-iOS.entitlements
    dependencies:
      - package: NoahCore
      - target: NoahWidgets
  # Variante de instalação com conta pessoal: mantém a Live Activity, sem widgets/App Group.
  Noah-iOS-Pessoal:
    type: application
    platform: iOS
    sources: [App, Compartilhado]
    info:
      path: Config/Noah-iOS-Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.nicholasbirochi.noah.atualizar]
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: "O Noah pede o Face ID antes de aceitar, responder ou dispensar uma pendência."
        NSMicrophoneUsageDescription: "O Noah ouve o microfone na aba Central para você conversar por voz. Dá para deixar mudo."
        NSSpeechRecognitionUsageDescription: "O Noah transforma sua fala em texto no próprio aparelho, sem mandar o áudio para fora."
        CFBundleURLTypes:
          - CFBundleURLName: com.nicholasbirochi.noah
            CFBundleURLSchemes: [noah]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasbirochi.noah.ios
        PRODUCT_NAME: Noah
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Config/Noah-iOS-Pessoal.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NOAH_SEM_APP_GROUP"
    dependencies:
      - package: NoahCore
      - target: NoahWidgets-Pessoal
  # Extensão pessoal: só IlhaAoVivo, sem widget de resumo/App Group.
  NoahWidgets-Pessoal:
    type: app-extension
    platform: iOS
    sources: [Widgets, Compartilhado]
    info:
      path: Config/NoahWidgets-Info.plist
      properties:
        CFBundleDisplayName: Noah
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasbirochi.noah.ios.widgets
        PRODUCT_NAME: NoahWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Config/Noah-iOS-Pessoal.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NOAH_SEM_APP_GROUP"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    dependencies:
      - package: NoahCore
  # Widgets da tela inicial e da tela bloqueada, mais a Live Activity da ilha.
  # Lê o resumo que o app grava no App Group (Ilha.grupo).
  NoahWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Compartilhado]
    info:
      path: Config/NoahWidgets-Info.plist
      properties:
        CFBundleDisplayName: Noah
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasbirochi.noah.ios.widgets
        PRODUCT_NAME: NoahWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Config/NoahWidgets.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    dependencies:
      - package: NoahCore
  Noah-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - Compartilhado
      # Ícone do Icon Composer: no macOS 26+ um PNG do catálogo vai parar dentro
      # de um segundo squircle cinza; o .icon recebe a máscara do sistema.
      - path: IconeMac/NoahIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Config/Noah-macOS-Info.plist
      properties:
        # Sem ícone no Dock: o Noah mora na barra de menus e na ilha do notch.
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Central por voz: o reconhecimento roda só no aparelho.
        NSMicrophoneUsageDescription: "O Noah ouve o microfone na aba Central para você conversar por voz. Dá para deixar mudo."
        NSSpeechRecognitionUsageDescription: "O Noah transforma sua fala em texto no próprio aparelho, sem mandar o áudio para fora."
        CFBundleURLTypes:
          - CFBundleURLName: com.nicholasbirochi.noah
            CFBundleURLSchemes: [noah]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasbirochi.noah.macos
        PRODUCT_NAME: Noah
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Config/Noah-macOS.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: NoahIcon
    dependencies:
      - package: NoahCore
schemes:
  Noah-iOS:
    build:
      targets:
        Noah-iOS: all
    run:
      config: Debug
  Noah-macOS:
    build:
      targets:
        Noah-macOS: all
    run:
      config: Debug

  Noah-iOS-Pessoal:
    build:
      targets:
        Noah-iOS-Pessoal: all
    run:
      config: Debug
