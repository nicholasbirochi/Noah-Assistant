<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noah">
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<title>Noah</title>
<style>
  :root {
    --fundo: #f4f4f7; --cartao: #ffffff; --cartao-2: #f0f0f4; --texto: #15151c; --suave: #6b6b7a;
    --borda: rgba(20, 20, 40, .10); --acento: #15151c; --sobre-acento: #ffffff; --erro: #c0392b; --ok: #1f9d55;
    --claude: #d97757; --codex: #3d8bfd; --noah: #7c6cff; --sombra: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0b0b10; --cartao: #15151d; --cartao-2: #1d1d27; --texto: #ececf1; --suave: #8d8d9c;
      --borda: rgba(255, 255, 255, .08); --acento: #ececf1; --sobre-acento: #0b0b10; --erro: #ff7a6b; --ok: #4ade80;
      --claude: #e08a6b; --codex: #6aa8ff; --noah: #9d91ff; --sombra: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--fundo); }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 680px; margin: 0 auto; padding: 0 16px calc(32px + env(safe-area-inset-bottom)); }
  header {
    position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--fundo) 88%, transparent);
    -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px);
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
  }
  .topo { display: flex; align-items: center; gap: 10px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.55rem; letter-spacing: -.02em; margin: 0; font-weight: 700; }
  .abas {
    display: flex; gap: 4px; max-width: 680px; margin: 12px auto 0; padding: 3px; border-radius: 12px;
    background: var(--cartao-2); border: 1px solid var(--borda);
  }
  .aba {
    flex: 1; border: 0; border-radius: 9px; background: none; color: var(--suave); font: inherit; font-size: .9rem;
    font-weight: 600; padding: 7px 10px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; justify-content: center;
  }
  .aba[aria-selected="true"] { background: var(--cartao); color: var(--texto); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .contagem {
    min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--acento); color: var(--sobre-acento);
    font-size: .75rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  }
  .contagem.zero { display: none; }
  .espaco { flex: 1; }
  .icone-btn {
    width: 36px; height: 36px; border-radius: 18px; border: 1px solid var(--borda); background: var(--cartao);
    color: var(--texto); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .icone-btn svg { width: 18px; height: 18px; }
  .icone-btn.girando svg { animation: girar .9s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .chips { display: flex; gap: 8px; overflow-x: auto; max-width: 680px; margin: 12px auto 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--borda); background: var(--cartao); color: var(--texto); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
  }
  .chip[aria-pressed="true"] { background: var(--acento); color: var(--sobre-acento); border-color: transparent; }
  .chip .n { opacity: .6; font-weight: 500; }
  .ponto { width: 8px; height: 8px; border-radius: 4px; display: inline-block; flex: none; }
  .ponto.claude { background: var(--claude); } .ponto.codex { background: var(--codex); } .ponto.noah { background: var(--noah); }

  .aviso { margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--cartao-2); color: var(--suave); font-size: .85rem; }
  .aviso.erro { color: var(--erro); }
  .andamento { display: grid; gap: 8px; margin-top: 12px; }
  .job {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--cartao);
    border: 1px solid var(--borda); font-size: .85rem;
  }
  .job .rotulo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job .estado { color: var(--suave); white-space: nowrap; }
  .job.erro .estado { color: var(--erro); } .job.concluido .estado { color: var(--ok); }
  .job details { flex-basis: 100%; }
  .job { flex-wrap: wrap; }
  .job pre { white-space: pre-wrap; margin: 6px 0 0; font-size: .8rem; color: var(--suave); }
  .pulso { width: 8px; height: 8px; border-radius: 4px; background: var(--ok); animation: pulso 1.2s ease-in-out infinite; flex: none; }
  @keyframes pulso { 50% { opacity: .25; } }

  .lista { display: grid; gap: 12px; margin-top: 14px; }
  article {
    background: var(--cartao); border: 1px solid var(--borda); border-radius: 18px; padding: 14px 16px; box-shadow: var(--sombra);
    animation: entrar .25s ease-out;
  }
  @keyframes entrar { from { opacity: 0; transform: translateY(4px); } }
  .meta { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--suave); min-width: 0; }
  .fonte { font-weight: 700; color: var(--texto); display: inline-flex; gap: 6px; align-items: center; }
  .meta .projeto { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .meta .tempo { margin-left: auto; white-space: nowrap; }
  h2 { font-size: 1.02rem; line-height: 1.35; margin: 8px 0 6px; font-weight: 650; letter-spacing: -.01em; }
  .msg { color: var(--texto); opacity: .92; font-size: .92rem; overflow-wrap: anywhere; }
  .msg.curta { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .msg p { margin: 0 0 .6em; } .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 0 0 .6em; padding-left: 1.2em; }
  .msg code { font: .85em ui-monospace, "SF Mono", Menlo, monospace; background: var(--cartao-2); padding: 1px 5px; border-radius: 5px; }
  .msg pre { background: var(--cartao-2); padding: 10px 12px; border-radius: 10px; overflow-x: auto; margin: 0 0 .6em; }
  .msg pre code { background: none; padding: 0; }
  .msg h3 { font-size: .95rem; margin: .4em 0 .3em; }
  .mais { background: none; border: 0; color: var(--suave); font: inherit; font-size: .82rem; font-weight: 600; padding: 4px 0; cursor: pointer; }
  .acao-noah { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--cartao-2); font-size: .88rem; }
  .porque { margin: 8px 0 0; font-size: .95rem; overflow-wrap: anywhere; }
  .acao-noah .rotulo-acao { display: block; font-size: .75rem; font-weight: 700; color: var(--suave); margin-bottom: 2px; }
  .acao-noah code { font: .85rem ui-monospace, "SF Mono", Menlo, monospace; overflow-wrap: anywhere; }
  .vazio p { margin: 8px auto 0; max-width: 440px; }
  .vazio code { font: .85em ui-monospace, "SF Mono", Menlo, monospace; background: var(--cartao-2); padding: 1px 5px; border-radius: 5px; }

  form.responder { margin-top: 12px; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 42px; max-height: 180px; overflow-y: hidden; padding: 10px 14px; border-radius: 21px;
    border: 1px solid var(--borda); background: var(--cartao-2); color: var(--texto); font: inherit; font-size: 16px; line-height: 1.35;
  }
  textarea:focus { outline: 2px solid color-mix(in srgb, var(--texto) 25%, transparent); outline-offset: 0; }
  .enviar {
    width: 42px; height: 42px; border-radius: 21px; border: 0; background: var(--acento); color: var(--sobre-acento);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; padding: 0;
  }
  .enviar:disabled { opacity: .35; cursor: default; }
  .enviar svg { width: 18px; height: 18px; }
  .rodape { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .dispensar { background: none; border: 0; color: var(--suave); font: inherit; font-size: .8rem; padding: 4px 0; cursor: pointer; }
  .nota { font-size: .78rem; color: var(--suave); }
  .respondendo { margin-top: 12px; display: flex; align-items: center; gap: 8px; color: var(--suave); font-size: .85rem; }

  .vazio { text-align: center; color: var(--suave); padding: 64px 16px; }
  .vazio strong { display: block; color: var(--texto); font-size: 1.1rem; margin-bottom: 4px; }
  .token { background: var(--cartao); border: 1px solid var(--borda); border-radius: 18px; padding: 18px; margin-top: 16px; }
  .token p { margin: 0 0 12px; color: var(--suave); font-size: .9rem; }
  .token form { display: flex; gap: 8px; }
  .token input {
    flex: 1; font-size: 16px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--borda);
    background: var(--cartao-2); color: var(--texto);
  }
  .token button { border: 0; border-radius: 12px; padding: 0 16px; background: var(--acento); color: var(--sobre-acento); font: inherit; font-weight: 600; cursor: pointer; }
  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--acento); color: var(--sobre-acento); padding: 10px 16px; border-radius: 12px; font-size: .88rem;
    max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.25); z-index: 10;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="topo">
    <h1>Noah</h1>
    <span class="espaco"></span>
    <button id="atualizar" class="icone-btn" type="button" aria-label="Atualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>
  </div>
  <nav class="abas" role="tablist" aria-label="Seções">
    <button id="aba-pendencias" class="aba" type="button" role="tab" aria-controls="painel-pendencias" aria-selected="true">
      Pendências <span id="n-pendencias" class="contagem zero">0</span>
    </button>
    <button id="aba-presenca" class="aba" type="button" role="tab" aria-controls="painel-presenca" aria-selected="false">
      Presença <span id="n-presenca" class="contagem zero">0</span>
    </button>
  </nav>
  <div id="chips" class="chips" role="toolbar" aria-label="Filtrar por fonte"></div>
</header>
<main>
  <section id="token" class="token" hidden>
    <p>Esta central pede um token. Use o mesmo que você passou em <code>--token</code> ao abrir a central no Mac.</p>
    <form id="form-token">
      <input id="campo-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Token" aria-label="Token">
      <button type="submit">Entrar</button>
    </form>
  </section>
  <section id="painel-pendencias" role="tabpanel" aria-labelledby="aba-pendencias">
    <div id="avisos"></div>
    <div id="andamento" class="andamento"></div>
    <div id="lista" class="lista" aria-live="polite"></div>
  </section>
  <section id="painel-presenca" role="tabpanel" aria-labelledby="aba-presenca" hidden>
    <div id="avisos-presenca"></div>
    <div id="lista-presenca" class="lista" aria-live="polite"></div>
  </section>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
